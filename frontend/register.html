<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">GestorOpiniones</a>
    </nav>

    <div class="auth-container">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Crear Cuenta</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña (mín 6 caracteres)</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn w-100">Registrarse</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            ¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a>
        </p>
    </div>

    <script type="module">
        import { registerUser, isAuthenticated } from './js/auth.js';
        import { showToast } from './js/utils.js';

        if (isAuthenticated()) window.location.href = 'dashboard.html';

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userData = {
                name: document.getElementById('name').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            const success = await registerUser(userData);
            if (success) {
                showToast('Cuenta creada!', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            }
        });
    </script>
</body>
</html>
